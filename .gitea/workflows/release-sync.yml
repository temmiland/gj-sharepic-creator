name: Sync Release to GitHub

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Create GitHub Release
              env:
                  GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
                  RELEASE_TAG: ${{ gitea.event.release.tag_name }}
                  RELEASE_NAME: ${{ gitea.event.release.name }}
                  RELEASE_BODY: ${{ gitea.event.release.body }}
                  RELEASE_PRERELEASE: ${{ gitea.event.release.prerelease }}
              run: |
                  set -euo pipefail

                  jq -n \
                      --arg tag "$RELEASE_TAG" \
                      --arg name "$RELEASE_NAME" \
                      --arg body "$RELEASE_BODY" \
                      --arg prerelease "$RELEASE_PRERELEASE" \
                      '{
                          tag_name: $tag,
                          name: (if $name == "" then $tag else $name end),
                          body: $body,
                          prerelease: ($prerelease == "true")
                      }' > payload.json

                  status="$(curl -sS -X POST \
                      -o response.json -w '%{http_code}' \
                      -H "Authorization: Bearer $GITHUB_API_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      -H "Content-Type: application/json" \
                      https://api.github.com/repos/temmiland/gj-sharepic-creator/releases \
                      --data-binary @payload.json)"

                  if [ "$status" -ge 300 ]; then
                      echo "GitHub API returned HTTP $status"
                      cat response.json
                      exit 1
                  fi

                  echo "Created GitHub release: $(jq -r '.html_url' response.json)"
